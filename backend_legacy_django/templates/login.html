<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch Sentinel EDR - Login Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-surface: #051424;
            --bg-container: #0d1c2d;
            --border-color: #273647;
            --accent-cyan: #00E5FF;
            --text-primary: #d4e4fa;
        }
        body {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cyber-input {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 0px;
            padding: 12px 15px;
            font-size: 14px;
            width: 100%;
            margin-bottom: 20px;
        }
        .cyber-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            outline: none;
        }
        .cyber-btn {
            background-color: var(--accent-cyan);
            color: #051424;
            font-weight: 700;
            border: none;
            padding: 12px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cyber-btn:hover {
            background-color: #5effff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <i class="fa-solid fa-shield-halved"></i>
        <span>STITCH SENTINEL EDR</span>
    </div>
    
    {% if error %}
    <div class="alert alert-danger bg-danger bg-opacity-25 border border-danger text-light small py-2 mb-3 rounded-0">
        <i class="fa-solid fa-triangle-exclamation me-2"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login/">
        {% csrf_token %}
        <div class="mb-1">
            <label class="text-muted small fw-bold mb-2">OPERATOR USERNAME</label>
            <input type="text" name="username" class="cyber-input" placeholder="e.g. admin" required>
        </div>
        <div class="mb-1">
            <label class="text-muted small fw-bold mb-2">ACCESS PASSWORD</label>
            <input type="password" name="password" class="cyber-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="cyber-btn mt-2">Authenticate Session</button>
    </form>
</div>

</body>
</html>
